# PawMatch 테마: 흰 배경 + 발랄한 주황 포인트, 둥근 모서리, 귀여운 제목 글꼴
# base를 light로 고정해서 휴대폰이 다크 모드여도 같은 밝은 화면을 보여줍니다.
# 글꼴: Google Fonts의 Jua(제목), Gowun Dodum(본문) — SIL Open Font License 1.1

[theme]
base = "light"
primaryColor = "#FF8A3D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFF4EC"
textColor = "#3A2E2A"
baseRadius = "large"
buttonRadius = "full"
font = "Gowun Dodum:https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap"
headingFont = "Jua:https://fonts.googleapis.com/css2?family=Jua&display=swap"
# Jua는 보통 굵기 하나뿐이라, 굵게(600~700) 그리면 브라우저가 획을 억지로 두껍게 만들어 뭉개집니다.
headingFontWeights = [400, 400, 400, 400, 400, 400]

[server]
# 사진으로 찾기에 올리는 사진 크기 한도(MB). 기본 200MB는 메모리가 1GB 정도인 Streamlit Cloud에 너무 큽니다.
maxUploadSize = 10
