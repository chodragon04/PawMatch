# PR을 올리거나 main에 반영될 때마다 테스트(pytest)를 자동으로 돌립니다.
# 테스트는 실제 API·모델 없이(가짜 응답으로) 돌아가서 API 키가 필요 없습니다.

name: 테스트

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 패키지 설치
        run: pip install -r requirements-dev.txt

      - name: 테스트
        run: pytest -q
