# 30분마다 공공데이터 API에서 보호견·보호소 데이터를 받아 `data` 브랜치에 저장합니다.
# 앱(pawmatch/data.py)은 이 파일을 먼저 읽어서, 첫 화면을 API 응답을 기다리지 않고 보여줍니다.
# 이어서 '사진으로 찾기'에 쓰는 보호견 사진 임베딩(embeddings.npz)도 새로 들어온 사진만 계산해 함께 저장합니다.
#
# 필요한 설정: 저장소 Settings → Secrets and variables → Actions → New repository secret
#   이름: DATA_GO_KR_API_KEY / 값: 공공데이터포털 일반 인증키(Decoding)
#
# `data` 브랜치는 매번 커밋 1개로 덮어쓰므로(force push) main의 커밋 기록에 영향을 주지 않습니다.

name: 보호견 데이터 갱신

on:
  schedule:
    # 매시 7분, 37분 (UTC). GitHub 예약 실행은 붐비는 정각 무렵에 자주 밀리거나 빠져서 피하고,
    # 한 번 빠져도 다음 실행이 곧 오도록 30분마다 실행합니다.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests python-dotenv "fastembed>=0.9,<1"

      # CLIP 모델 파일(약 340MB)을 매번 내려받지 않도록 저장해 둡니다.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/fastembed
          key: fastembed-clip-vit-b-32-v1

      # 공공데이터 API가 잠깐 응답하지 않으면 1분 간격으로 다시 시도하고, 그래도 안 되면
      # 저장된 데이터가 12시간 이내일 때는 '건너뜀'(updated=false)으로 끝냅니다. 이때 아래 단계는 모두 건너뜁니다.
      # (빈 out 폴더를 data 브랜치에 저장하면 데이터가 지워지므로 updated == 'true'일 때만 저장)
      - name: 데이터 받기
        id: fetch
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python scripts/fetch_data.py --out out

      # 실패해도 데이터 스냅샷은 저장되도록 계속 진행합니다. (임베딩 파일이 없으면 저장 단계가 이전 파일을 그대로 둠)
      # GitHub 서버에서 한국 사진 서버까지 한 장 받는 데 오래 걸려서(8장씩 동시에 받을 때 초당 약 0.9장)
      # 동시에 16장씩 받습니다.
      - name: 사진 임베딩
        if: steps.fetch.outputs.updated == 'true'
        continue-on-error: true
        run: |
          export FASTEMBED_CACHE_PATH="$HOME/.cache/fastembed"
          python scripts/build_embeddings.py --snapshot out/snapshot.json.gz --out out --time-budget 1800 --workers 16

      - name: data 브랜치에 저장
        if: steps.fetch.outputs.updated == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 이번에 임베딩을 만들지 못했으면 data 브랜치의 이전 파일을 그대로 둡니다. (force push로 지워지지 않게)
          if [ ! -f out/embeddings.npz ]; then
            if git fetch -q --depth 1 origin data && git show FETCH_HEAD:embeddings.npz > out/embeddings.npz; then
              echo "이번에 만든 임베딩이 없어서 이전 embeddings.npz를 그대로 저장합니다."
            else
              rm -f out/embeddings.npz
              echo "::warning::embeddings.npz가 없습니다. 사진으로 찾기가 준비 중으로 보일 수 있습니다."
            fi
          fi
          cd out
          cat > README.md <<'EOF'
          # PawMatch 데이터 스냅샷

          GitHub Actions(`.github/workflows/update-data.yml`)가 30분마다 자동으로 갱신하는 브랜치입니다.
          직접 수정하지 마세요.

          출처: 공공데이터포털(data.go.kr), 농림축산식품부 농림축산검역본부 국가동물보호정보시스템
          EOF
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "보호견 데이터 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
